[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redteamarena"
version = "0.1.0"
description = "Deterministic, model-agnostic security preflight testing for AI-agent repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RedTeamArena contributors"}]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "httpx>=0.27",
  "reportlab>=4.2",
  "Pillow>=10.3",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-Pillow>=10.2",
]
transformers = ["transformers>=4.42", "torch>=2.3"]

[project.scripts]
redteamarena = "redteamarena.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redteamarena = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["redteamarena"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
ignore = ["B008", "B905"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["redteamarena"]
exclude = ["tests/fixtures", "examples"]
